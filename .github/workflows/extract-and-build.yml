name: Extract source and build APK
# Re-run CI after Python 3.12 toolchain fix

on:
  push:
    branches: [main]
    paths:
      - 'OreshnikAgent-patched-source.zip'
      - '.github/workflows/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'runtime-catalog.json'
      - 'BUILDING.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: extract-build-main
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="OreshnikAgent-patched-source.zip"
          if [ -f "$archive" ]; then
            unzip -t "$archive"
            rm -rf .source-extract
            mkdir .source-extract
            unzip -q "$archive" -d .source-extract
            project_file="$(find .source-extract -mindepth 1 -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$project_file" ]; then
              echo "Could not locate settings.gradle.kts in uploaded archive"
              exit 1
            fi
            project_dir="$(dirname "$project_file")"
            rsync -a --exclude='.git/' --exclude='.github/' "$project_dir/" ./
            rm -rf .source-extract "$archive"
          elif [ -f settings.gradle.kts ] && [ -f gradlew ]; then
            echo "Source already extracted; continuing with build."
          else
            echo "Neither source archive nor extracted Gradle project is present."
            exit 1
          fi
          test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Commit extracted source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract patched Android source into main"
            git push origin HEAD:main
          else
            echo "No source changes to commit"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      - name: Run unit tests and generate dependency report
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintRelease --stacktrace
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OreshnikAgent-release-apk
          path: |
            app/build/outputs/apk/release/*
            dependency-report.txt
          if-no-files-found: error
          retention-days: 14
