name: Extract source and build APK
# Re-run CI after Python 3.12 toolchain fix

on:
  push:
    branches: [main]
    paths:
      - 'OreshnikAgent-patched-source.zip'
      - '.github/workflows/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'runtime-catalog.json'
      - 'BUILDING.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: oreshik-main-build-v5
  cancel-in-progress: true

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="OreshnikAgent-patched-source.zip"
          if [ -f "$archive" ]; then
            unzip -t "$archive"
            rm -rf .source-extract
            mkdir .source-extract
            unzip -q "$archive" -d .source-extract
            project_file="$(find .source-extract -mindepth 1 -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
            if [ -z "$project_file" ]; then
              echo "Could not locate settings.gradle.kts in uploaded archive"
              exit 1
            fi
            project_dir="$(dirname "$project_file")"
            rsync -a --exclude='.git/' --exclude='.github/' "$project_dir/" ./
            rm -rf .source-extract "$archive"
          elif [ -f settings.gradle.kts ] && [ -f gradlew ]; then
            echo "Source already extracted; continuing with build."
          else
            echo "Neither source archive nor extracted Gradle project is present."
            exit 1
          fi
          test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Commit extracted source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract patched Android source into main"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No source changes to commit"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      - name: Run unit tests
        timeout-minutes: 12
        run: ./gradlew --no-daemon --console=plain --info :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        timeout-minutes: 15
        run: ./gradlew --no-daemon --console=plain :app:lintRelease --stacktrace

      - name: Generate dependency report
        shell: bash
        run: ./gradlew --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt

      - name: Build release APK
        timeout-minutes: 20
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease --stacktrace

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish APK and checksum in repository root
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -eq 1
          install -m 0644 "${apks[0]}" OreshnikAgent-release.apk
          sha256sum OreshnikAgent-release.apk > OreshnikAgent-release.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OreshnikAgent-release.apk OreshnikAgent-release.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified release APK in repository root"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OreshnikAgent-release-apk
          path: |
            app/build/outputs/apk/release/*
            OreshnikAgent-release.apk
            OreshnikAgent-release.apk.sha256
            dependency-report.txt
          if-no-files-found: error
          retention-days: 14
