name: Extract source and build APK

on:
  push:
    branches: [main]
    paths:
      - 'OreshnikAgent-patched-source.zip'
      - '.github/workflows/extract-and-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: extract-build-main
  cancel-in-progress: false

jobs:
  extract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          archive="OreshnikAgent-patched-source.zip"
          test -f "$archive"
          unzip -t "$archive"
          rm -rf .source-extract
          mkdir .source-extract
          unzip -q "$archive" -d .source-extract
          project_dir="$(find .source-extract -mindepth 1 -maxdepth 3 -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$project_dir" ]; then
            echo "Could not locate settings.gradle.kts in uploaded archive"
            exit 1
          fi
          project_dir="$(dirname "$project_dir")"
          # Keep workflows managed separately; GITHUB_TOKEN cannot push workflow files.
          rsync -a --exclude='.git/' --exclude='.github/' "$project_dir/" ./
          rm -rf .source-extract "$archive"
          test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Commit extracted source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract patched Android source into main"
            git push origin HEAD:main
          else
            echo "No source changes to commit"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OreshnikAgent-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
