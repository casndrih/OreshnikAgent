# Project-wide Gradle settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
# KSP currently registers generated sources through the Kotlin source-set DSL.
android.disallowKotlinSourceSets=false
# Required by AGP when retaining the source-set integration used by KSP.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
